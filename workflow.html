            --brand-500: #ec4899;
            --brand-600: #db2777;

            --surface: #fcfaf8;

        body {
            background-color: var(--surface);
            color: #0f172a;
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
        }
        .glass-card {

            background: #cbd5e1;
            border-radius: 9999px;

        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .bg-brand-50 { background-color: var(--brand-50); }
        .bg-brand-100 { background-color: var(--brand-100); }
        .bg-brand-500 { background-color: var(--brand-500); }
        .bg-brand-600 { background-color: var(--brand-600); }
        .text-brand-500 { color: var(--brand-500); }
        .text-brand-600 { color: var(--brand-600); }
        .border-brand-500 { border-color: var(--brand-500); }
        .shadow-brand-200 { box-shadow: 0 10px 15px -3px rgba(236, 72, 153, 0.2); }
    </style>
</head>

        </main>

        <!-- Bottom Navigation Bar for Phone App UI -->

    <!-- Modals Container -->
    <div id="modals"></div>

    <script>
        // --- Default Fallback Data ---

                { employeeid: 'emp_2', employeename: 'David Miller', role: 'Site Engineer', phone: '+1 (555) 017-4545', email: 'd.miller@nextgen.com' },

                { id: 'ps_1', projectrefno: 'PRJ-2024-001', projectname: 'Riverview Heights', stageid: 'stg_1', stageowner: 'Robert Chen', projectstatus: 'Active', unit: 'un_1', unitstatus: 'Completed', plannedstartdate: '2024-01-20', plannedenddate: '2024-02-15', actualstartdate: '2024-01-20', actualenddate: '2024-02-12', comments: 'Excavation completed ahead of schedule.', delaydays: 0, remarks: 'Excellent progress' },
                { id: 'ps_2', projectrefno: 'PRJ-2024-001', projectname: 'Riverview Heights', stageid: 'stg_1', stageowner: 'David Miller', projectstatus: 'Active', unit: 'un_2', unitstatus: 'Completed', plannedstartdate: '2024-02-16', plannedenddate: '2024-03-10', actualstartdate: '2024-02-16', actualenddate: '2024-03-12', comments: 'Pile drilling complete.', delaydays: 2, remarks: 'Weather delay' },
                { id: 'ps_3', projectrefno: 'PRJ-2024-001', projectname: 'Riverview Heights', stageid: 'stg_1', stageowner: 'David Miller', projectstatus: 'Active', unit: 'un_3', unitstatus: 'WIP', plannedstartdate: '2024-03-11', plannedenddate: '2024-04-05', actualstartdate: '2024-03-15', actualenddate: '', comments: 'Curing in progress.', delaydays: 5, remarks: 'Curing time required' }
            ],
            dailyLogs: [
                { date: '2024-03-20', projectrefno: 'PRJ-2024-001', projectname: 'Riverview Heights', stageid: 'stg_1', unit: 'un_3', employee: 'emp_2', workdescription: 'Poured concrete for foundation curing.', status: 'WIP' },
                { date: '2024-03-19', projectrefno: 'PRJ-2024-001', projectname: 'Riverview Heights', stageid: 'stg_1', unit: 'un_2', employee: 'emp_3', workdescription: 'Final inspection of steel reinforcement cages.', status: 'Completed' }
            ],
            delayLogs: []
        };

        const DEFAULT_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyQUp_zmdYG4DdAgZyiqBOUd5B7AhwBrQP7q_onF6EdfBbKjXj_sBJeoFVOm90Qrs_m/exec';

        const getCached = (key, fallback) => {
            const val = localStorage.getItem(key);
            if (val && val !== '[]' && val !== 'undefined') {
                try {
                    const parsed = JSON.parse(val);
                    if (Array.isArray(parsed) && key === 'nxg_delayLogs') {
                        return parsed.filter(item => !['dl_1', 'dl_2', 'dl_3'].includes(item.id));
                    }
                    return parsed;
                } catch (e) {
                    return fallback;
                }
            }
            return fallback;
        };

        // --- Application State ---
        const state = {
            scriptUrl: DEFAULT_SCRIPT_URL,
            projects: getCached('nxg_projects', DEFAULT_DATA.projects),
            stages: getCached('nxg_stages', DEFAULT_DATA.stages),
            units: getCached('nxg_units', DEFAULT_DATA.units),
            employees: getCached('nxg_employees', DEFAULT_DATA.employees),
            projectStages: getCached('nxg_projectStages', DEFAULT_DATA.projectStages),
            dailyLogs: getCached('nxg_dailyLogs', DEFAULT_DATA.dailyLogs),
            delayLogs: getCached('nxg_delayLogs', DEFAULT_DATA.delayLogs),
            delayFilters: { project: 'ALL', stage: 'ALL', person: 'ALL', dateFrom: '', dateTo: '', activeTab: 'history' },
            stagePlannings: getCached('nxg_stagePlannings', []),
            loading: false,
            error: null,
            lastSyncTime: localStorage.getItem('nxg_lastSync'),
            currentPath: window.location.hash.slice(1) || '/',
            lastPath: null,
            refreshing: false,
            showCompletedProjects: false,
            syncStatus: 'idle', // 'idle', 'syncing', 'success', 'error'
            mobileMenuOpen: false
        };

        // --- Data Normalization Utilities ---
        function normalizeKey(k) {
            return String(k || '').toLowerCase().replace(/[\s_\-]/g, '');
        }

        function getVal(obj, key) {
            if (!obj) return '';
            const target = normalizeKey(key);
            
            if (obj[key] !== undefined && obj[key] !== null) return obj[key];
            
            for (let k in obj) {
                if (normalizeKey(k) === target) return obj[k];
            }
            
            const mappings = {
                'stageid': ['stageId', 'Stage ID', 'stageid', 'stage'],
                'unitid': ['unitId', 'Unit ID', 'unitid', 'unit'],
                'projectrefno': ['projectRefNo', 'Project Ref No', 'refno', 'projectrefno', 'project'],
                'stagename': ['stageName', 'Stage Name', 'stagename', 'stage'],
                'unitname': ['unitName', 'Unit Name', 'unitname', 'unit'],
                'overallstatus': ['status', 'Overall Status', 'projectstatus', 'overallstatus'],
                'unitstatus': ['status', 'Unit Status', 'unitstatus'],
                'workdescription': ['description', 'Work Description', 'comments']
            };
            
            if (mappings[target]) {
                for (let altKey of mappings[target]) {
                    const normAlt = normalizeKey(altKey);
                    for (let k in obj) {
                        if (normalizeKey(k) === normAlt) return obj[k];
                    }
                }
            }
            return '';
        }

        function isEqual(a, b) {
            if (a === b) return true;
            if (a == null || b == null) return false;
            const sa = String(a).trim().toLowerCase();
            const sb = String(b).trim().toLowerCase();
            return sa === sb || sa === sb.replace(/^0+/, '') || sb === sa.replace(/^0+/, '');
        }

        function toInputDate(dateVal) {
            if (!dateVal) return '';
            if (typeof dateVal === 'string') {
                if (dateVal.includes('T')) return dateVal.split('T')[0];
                if (/^\d{4}-\d{2}-\d{2}$/.test(dateVal.trim())) return dateVal.trim();
            }
            try {
                const d = new Date(dateVal);
                if (isNaN(d.getTime())) return '';
                return d.toISOString().split('T')[0];
            } catch (e) {
                return '';
            }
        }

        function formatDate(dateString) {
            if (!dateString) return "-";
            try {
                const date = new Date(dateString);
                if (isNaN(date.getTime())) return dateString;
                return date.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
            } catch { return dateString; }
        }

        function getStatusColor(status) {
            const s = (status || '').toLowerCase();
            if (s === 'completed') return 'bg-emerald-100 text-emerald-700 border-emerald-200';
            if (s === 'wip' || s === 'in progress') return 'bg-amber-100 text-amber-700 border-amber-200';
            if (s === 'hold') return 'bg-rose-100 text-rose-700 border-rose-200';
            if (s === 'not required') return 'bg-slate-100 text-slate-500 border-slate-200';
            return 'bg-slate-100 text-slate-600 border-slate-200';
        }

        function calculateDelayDays(plannedEnd, actualEnd, lastDate) {
            if (!plannedEnd) return 0;
            const pEnd = new Date(plannedEnd);
            const aEnd = actualEnd ? new Date(actualEnd) : (lastDate ? new Date(lastDate) : new Date());
            if (isNaN(pEnd.getTime()) || isNaN(aEnd.getTime())) return 0;
            const d1 = new Date(pEnd.getFullYear(), pEnd.getMonth(), pEnd.getDate());
            const d2 = new Date(aEnd.getFullYear(), aEnd.getMonth(), aEnd.getDate());
            if (d2 <= d1) return 0;
            const diffTime = d2 - d1;
            return Math.floor(diffTime / (1000 * 60 * 60 * 24));
        }

        function getTaskDelay(ps) {
            if (!ps) return 0;

            let delay = 0;

            const plannedEnd = getVal(ps, 'plannedenddate');
            const actualEnd = getVal(ps, 'actualenddate');
            const plannedStart = getVal(ps, 'plannedstartdate');
            const actualStart = getVal(ps, 'actualstartdate');

            // 1. Cross-check stage-wise Planned End Date vs Actual End Date
            if (plannedEnd && actualEnd) {
                const pEnd = new Date(plannedEnd);
                const aEnd = new Date(actualEnd);
                if (!isNaN(pEnd.getTime()) && !isNaN(aEnd.getTime())) {
                    const d1 = new Date(pEnd.getFullYear(), pEnd.getMonth(), pEnd.getDate());
                    const d2 = new Date(aEnd.getFullYear(), aEnd.getMonth(), aEnd.getDate());
                    if (d2 > d1) {
                        delay = Math.max(delay, Math.floor((d2 - d1) / (1000 * 60 * 60 * 24)));
                    }
                }
            }

            // 2. Cross-check stage-wise Planned Start Date vs Actual Start Date
            if (plannedStart && actualStart) {
                const pStart = new Date(plannedStart);
                const aStart = new Date(actualStart);
                if (!isNaN(pStart.getTime()) && !isNaN(aStart.getTime())) {
                    const s1 = new Date(pStart.getFullYear(), pStart.getMonth(), pStart.getDate());
                    const s2 = new Date(aStart.getFullYear(), aStart.getMonth(), aStart.getDate());
                    if (s2 > s1) {
                        delay = Math.max(delay, Math.floor((s2 - s1) / (1000 * 60 * 60 * 24)));
                    }
                }
            }

            // 3. Fallback to explicit delaydays property if present
            const sheetDelay = getVal(ps, 'delaydays');
            if (sheetDelay !== undefined && sheetDelay !== null && sheetDelay !== '' && !isNaN(Number(sheetDelay))) {
                delay = Math.max(delay, parseInt(sheetDelay, 10));
            }

            return Math.max(0, delay);
        }

        window.setLogFilter = function(type, value) {
            if (!state.logFilters) state.logFilters = { date: 'all', stage: 'all', employee: 'all' };
            state.logFilters[type] = value;
            render();
        };

        function preparePayload(data) {
            if (!data || typeof data !== 'object') return data;
            const result = { ...data };
            for (let k in data) {
                const lowerKey = normalizeKey(k);
                if (result[lowerKey] === undefined) {
                    result[lowerKey] = data[k];
                }
                if (lowerKey === 'projectrefno') result.projectRefNo = data[k];
                if (lowerKey === 'projectname') result.projectName = data[k];
                if (lowerKey === 'stageid') result.stageId = data[k];
                if (lowerKey === 'unitid') result.unitId = data[k];
                if (lowerKey === 'employeeid') result.employeeId = data[k];
                if (lowerKey === 'plannedstartdate') result.plannedStartDate = data[k];
                if (lowerKey === 'plannedenddate') result.plannedEndDate = data[k];
                if (lowerKey === 'actualstartdate') result.actualStartDate = data[k];
                if (lowerKey === 'actualenddate') result.actualEndDate = data[k];
                if (lowerKey === 'lastdate') result.lastDate = data[k];
                if (lowerKey === 'stageowner') result.stageOwner = data[k];
                if (lowerKey === 'unitstatus') result.unitStatus = data[k];
                if (lowerKey === 'overallstatus') result.overallStatus = data[k];
                if (lowerKey === 'workdescription') result.workDescription = data[k];
                if (lowerKey === 'reasonfordelay') result.reasonForDelay = data[k];
                if (lowerKey === 'actionondelay') result.actionOnDelay = data[k];
            }
            return result;
        }

        function getProjectProgressDetails(projectRefNo) {
            const projectUnits = state.projectStages.filter(p => isEqual(getVal(p, 'projectrefno'), projectRefNo));
            const plannedUnits = projectUnits.length;
            const completedUnits = projectUnits.filter(u => getVal(u, 'unitstatus').toLowerCase() === 'completed').length;
            const pendingUnits = projectUnits.filter(u => {
                const s = getVal(u, 'unitstatus').toLowerCase();
                return s !== 'completed' && s !== 'not required';
            }).length;

            const plannedProgress = plannedUnits > 0 ? Math.round((completedUnits / plannedUnits) * 100) : 0;

            const totalPossibleUnits = state.units.length > 0 ? Math.max(state.units.length, plannedUnits) : plannedUnits;
            const actualProgress = totalPossibleUnits > 0 ? Math.round((completedUnits / totalPossibleUnits) * 100) : 0;

            const stagesMap = {};
            projectUnits.forEach(u => {
                const stageId = getVal(u, 'stageid') || 'General';
                if (!stagesMap[stageId]) stagesMap[stageId] = { total: 0, completed: 0 };
                stagesMap[stageId].total++;
                if (getVal(u, 'unitstatus').toLowerCase() === 'completed') stagesMap[stageId].completed++;
            });

            const totalStages = state.stages.length > 0 ? Math.max(state.stages.length, Object.keys(stagesMap).length) : Object.keys(stagesMap).length;
            let completedStages = 0;
            Object.values(stagesMap).forEach(s => {
                if (s.total > 0 && s.completed === s.total) completedStages++;
            });

            return {
                progress: actualProgress,
                plannedProgress,
                actualProgress,
                plannedUnits,
                totalUnits: plannedUnits,
                totalPossibleUnits,
                completedUnits,
                pendingUnits,
                totalStages,
                completedStages
            };
        }

        function getProjectStats(projectRefNo) {
            return getProjectProgressDetails(projectRefNo);
        }

        // --- API & Sync Engine ---
        function updateSyncStatusUI() {
            const syncDot = document.getElementById('sync-status-dot');
            const syncText = document.getElementById('sync-status-text');
            const syncRefreshIcon = document.getElementById('sync-refresh-icon');
            const syncErrorContainer = document.getElementById('sync-error-container');
            const syncTimeText = document.getElementById('sync-time-text');
            
            if (syncDot) {
                syncDot.className = `w-2 h-2 ${state.syncStatus === 'syncing' ? 'bg-amber-500 animate-bounce' : 'bg-emerald-500'} rounded-full`;
            }
            if (syncText) {
                syncText.innerText = state.syncStatus === 'syncing' ? "Syncing..." : "Connected";
            }
            if (syncRefreshIcon) {
                if (state.refreshing) syncRefreshIcon.classList.add('animate-spin');
                else syncRefreshIcon.classList.remove('animate-spin');
            }
            if (syncErrorContainer) {
                syncErrorContainer.innerHTML = '';
            }
            if (syncTimeText) {
                syncTimeText.innerText = state.lastSyncTime ? `Last sync: ${new Date(state.lastSyncTime).toLocaleTimeString()}` : "Sync Active";
            }
        }

        async function apiRequest(method, action, data = null) {
            state.syncStatus = 'syncing';
            state.error = null;
            updateSyncStatusUI();

            const targetUrl = state.scriptUrl || DEFAULT_SCRIPT_URL;

            try {
                let response;
                if (method === 'GET') {
                    const params = new URLSearchParams({ action, _t: Date.now() });
                    response = await fetch(`${targetUrl}?${params}`);
                } else {
                    const payload = preparePayload(data);
                    const options = {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action, data: payload })
                    };
                    response = await fetch(targetUrl, options);
                }

                if (response && response.type === 'opaque') {
                    state.syncStatus = 'success';
                    state.lastSyncTime = new Date().toISOString();
                    localStorage.setItem('nxg_lastSync', state.lastSyncTime);
                    updateSyncStatusUI();
                    setTimeout(() => { if (state.syncStatus === 'success') { state.syncStatus = 'idle'; updateSyncStatusUI(); } }, 2000);
                    return { status: 'ok', message: 'Request sent successfully' };
                }

                const text = await response.text();
                try {
                    const result = JSON.parse(text);
                    if (result.status === 'error') throw new Error(result.message || 'Backend execution failed');
                    state.syncStatus = 'success';
                    state.lastSyncTime = new Date().toISOString();
                    localStorage.setItem('nxg_lastSync', state.lastSyncTime);
                    updateSyncStatusUI();
                    setTimeout(() => { if (state.syncStatus === 'success') { state.syncStatus = 'idle'; updateSyncStatusUI(); } }, 2000);
                    return result;
                } catch (e) {
                    if (text.includes('<!DOCTYPE html>')) {
                        throw new Error("Received HTML response from Apps Script. Verify Web App Deployment access is set to 'Anyone'.");
                    }
                    state.syncStatus = 'success';
                    state.lastSyncTime = new Date().toISOString();
                    localStorage.setItem('nxg_lastSync', state.lastSyncTime);
                    updateSyncStatusUI();
                    setTimeout(() => { if (state.syncStatus === 'success') { state.syncStatus = 'idle'; updateSyncStatusUI(); } }, 2000);
                    return { status: 'ok', message: text };
                }
            } catch (err) {
                console.error(`API Request failed (${action}):`, err);
                state.syncStatus = 'error';
                state.error = err.message || "Connection failed";
                updateSyncStatusUI();
                throw err;
            }
        }

        async function refreshData(silent = false) {
            if (!silent) {
                state.refreshing = true;
                render();
            } else {
                state.refreshing = true;
                updateSyncStatusUI();
            }

            try {
                const data = await apiRequest('GET', 'getAll');
                if (data && data.status !== 'error') {
                    const findKey = (obj, target) => {
                        if (!obj) return null;
                        const targetNorm = normalizeKey(target);
                        for (let k in obj) {
                            if (normalizeKey(k) === targetNorm) return obj[k];
                        }
                        return null;
                    };

                    const isNotBlank = (obj) => {
                        if (!obj || typeof obj !== 'object') return false;
                        const vals = Object.values(obj).map(v => String(v || '').trim()).filter(Boolean);
                        return vals.length > 0;
                    };

                    const projectsData = findKey(data, 'projects');
                    const stagesData = findKey(data, 'stages');
                    const unitsData = findKey(data, 'units');
                    const employeesData = findKey(data, 'employees');
                    const projectStagesData = findKey(data, 'projectStages');
                    const dailyLogsData = findKey(data, 'dailyLogs');
                    const stagePlanningsData = findKey(data, 'stagePlannings');

                    const isDeleted = (sheet, item) => {
                        if (!item || !isNotBlank(item)) return true;
                        const deletedList = getCached('nxg_deletedKeys', []);
                        return deletedList.some(d => d.sheet === sheet && (
                            isEqual(getVal(item, d.key), d.value) ||
                            isEqual(item[d.key], d.value) ||
                            isEqual(getVal(item, 'employeeid'), d.value) ||
                            isEqual(getVal(item, 'employeename'), d.value) ||
                            isEqual(getVal(item, 'projectrefno'), d.value) ||
                            isEqual(getVal(item, 'stageid'), d.value) ||
                            isEqual(getVal(item, 'unitid'), d.value) ||
                            isEqual(getVal(item, 'id'), d.value)
                        ));
                    };

                    if (projectsData && Array.isArray(projectsData)) {
                        state.projects = projectsData.filter(p => !isDeleted('Projects', p) && (getVal(p, 'projectrefno') || getVal(p, 'projectname')));
                    }
                    if (stagesData && Array.isArray(stagesData)) {
                        state.stages = stagesData.filter(s => !isDeleted('Stages', s) && (getVal(s, 'stageid') || getVal(s, 'stagename')));
                    }
                    if (unitsData && Array.isArray(unitsData)) {
                        state.units = unitsData.filter(u => !isDeleted('Units', u) && (getVal(u, 'unitid') || getVal(u, 'unitname')));
                    }
                    if (employeesData && Array.isArray(employeesData)) {
                        state.employees = employeesData.filter(e => !isDeleted('Employees', e) && (getVal(e, 'employeeid') || getVal(e, 'employeename')));
                    }
                    if (projectStagesData && Array.isArray(projectStagesData)) {
                        state.projectStages = projectStagesData.filter(ps => !isDeleted('ProjectStages', ps) && (getVal(ps, 'projectrefno') || getVal(ps, 'stageid') || getVal(ps, 'id')));
                    }
                    if (dailyLogsData && Array.isArray(dailyLogsData)) {
                        state.dailyLogs = dailyLogsData.filter(d => !isDeleted('DailyLogs', d) && (getVal(d, 'projectrefno') || getVal(d, 'workdescription') || getVal(d, 'date')));
                    }
                    if (stagePlanningsData && Array.isArray(stagePlanningsData)) {
                        state.stagePlannings = stagePlanningsData.filter(sp => !isDeleted('StagePlannings', sp));
                    }

                    localStorage.setItem('nxg_projects', JSON.stringify(state.projects));
                    localStorage.setItem('nxg_stages', JSON.stringify(state.stages));
                    localStorage.setItem('nxg_units', JSON.stringify(state.units));
                    localStorage.setItem('nxg_employees', JSON.stringify(state.employees));
                    localStorage.setItem('nxg_projectStages', JSON.stringify(state.projectStages));
                    localStorage.setItem('nxg_dailyLogs', JSON.stringify(state.dailyLogs));
                    localStorage.setItem('nxg_delayLogs', JSON.stringify(state.delayLogs || []));
                    localStorage.setItem('nxg_stagePlannings', JSON.stringify(state.stagePlannings));
                }
            } catch (err) {
                console.error("Data refresh error:", err);
            } finally {
                state.refreshing = false;
                render();
            }
        }

        async function deleteItem(sheet, key, value) {
            if (!value || value === 'undefined' || value === 'null') {
                alert("Cannot delete: Missing record identifier.");
                return;
            }
            if (!confirm(`Are you sure you want to delete this record from ${sheet}?`)) return;

            const sheetToStateKey = {
                'Projects': 'projects',
                'Stages': 'stages',
                'Units': 'units',
                'Employees': 'employees',
                'ProjectStages': 'projectStages',
                'DailyLogs': 'dailyLogs',
                'DelayLogs': 'delayLogs'
            };

            // Store in deleted keys cache so it never reappears on sync
            const deletedList = getCached('nxg_deletedKeys', []);
            deletedList.push({ sheet, key, value });
            localStorage.setItem('nxg_deletedKeys', JSON.stringify(deletedList));

            const stateKey = sheetToStateKey[sheet];
            if (stateKey && state[stateKey]) {
                state[stateKey] = state[stateKey].filter(item => {
                    if (!item) return false;
                    const itemVal = getVal(item, key) || item[key];
                    const empVal = getVal(item, 'employeeid') || getVal(item, 'employeename');
                    const projVal = getVal(item, 'projectrefno');
                    const stageVal = getVal(item, 'stageid');
                    const unitVal = getVal(item, 'unitid');
                    const idVal = getVal(item, 'id');

                    if (isEqual(itemVal, value) || isEqual(empVal, value) || isEqual(projVal, value) || isEqual(stageVal, value) || isEqual(unitVal, value) || isEqual(idVal, value)) {
                        return false;
                    }
                    return true;
                });
                localStorage.setItem('nxg_' + stateKey, JSON.stringify(state[stateKey]));
            }

            render();

            try {
                await apiRequest('POST', 'deleteData', { sheet, key, value });
                await refreshData(true);
            } catch (err) {
                console.warn("Delete API request warning:", err);
            }
        }
        window.deleteItem = deleteItem;

        async function updateProjectStatus(ref, status) {
            const project = state.projects.find(p => isEqual(getVal(p, 'projectrefno'), ref));
            if (!project) return;
            project.overallstatus = status;
            project.overallStatus = status;
            render();
            try {
                await apiRequest('POST', 'updateProject', project);
                await refreshData(true);
            } catch (err) {
                alert("Failed to update project status: " + err.message);
                await refreshData();
            }
        }

        function showTakeActionModal(pRef, stageId, unitId, taskId) {
            let task = null;
            if (taskId) {
                task = state.projectStages.find(ps => isEqual(getVal(ps, 'id'), taskId));
            }
            if (!task && pRef && stageId && unitId) {
                task = state.projectStages.find(ps => 
                    isEqual(getVal(ps, 'projectrefno'), pRef) &&
                    isEqual(getVal(ps, 'stageid'), stageId) &&
                    isEqual(getVal(ps, 'unit'), unitId)
                );
            }
            if (!task && pRef) {
                task = state.projectStages.find(ps => isEqual(getVal(ps, 'id'), pRef));
            }
            if (!task) return;

            const projRef = getVal(task, 'projectrefno') || pRef;
            const stgId = getVal(task, 'stageid') || stageId;

        function updateDailyEntryStages(projectRefNo) {
            const stageSelect = document.getElementById('daily-entry-stage');
            if (!projectRefNo) {
                stageSelect.innerHTML = '<option value="">Select Stage...</option>';
                document.getElementById('daily-entry-unit').innerHTML = '<option value="">Select Unit...</option>';
                return;
            }

            const projectPlanning = state.projectStages.filter(p => isEqual(getVal(p, 'projectrefno'), projectRefNo));
            const plannedStageRefs = [...new Set(projectPlanning.map(p => getVal(p, 'stageid')))].filter(Boolean);

            let filteredStages = state.stages;
            if (plannedStageRefs.length > 0) {

        function getWhatsAppUrl(phone, msg) {

            const text = encodeURIComponent(msg || 'Hi, regarding project delay update');
            return `https://wa.me/${clean}?text=${text}`;

        function getTelUrl(phone) {
            if (!phone) return '#';

        }

        function formatShortDate(dateStr) {
            if (!dateStr) return '15 Aug';
            try {
                const parts = String(dateStr).split('-');
                if (parts.length === 3) {
                    const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                    const day = parseInt(parts[2], 10);
                    const monthIdx = parseInt(parts[1], 10) - 1;
                    if (!isNaN(day) && monthIdx >= 0 && monthIdx < 12) {
                        return `${day} ${months[monthIdx]}`;
                    }
                }
                const d = new Date(dateStr);
                if (!isNaN(d.getTime())) {
                    return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
                }
            } catch (e) {}
            return dateStr;
        }

        window.saveDelayLog = function(e, existingId) {
            e.preventDefault();
            const form = e.target;
            const formData = new FormData(form);

            const pRef = formData.get('projectrefno');
            const project = state.projects.find(p => isEqual(getVal(p, 'projectrefno'), pRef));
            const stage = state.stages.find(s => isEqual(getVal(s, 'stageid'), formData.get('stageid')));

            const item = {
                id: existingId || ('dl_' + Date.now()),
                date: formData.get('date'),
                projectrefno: pRef,
                projectname: (project ? getVal(project, 'projectname') : pRef) || pRef,
                stageid: formData.get('stageid'),
                stagename: (stage ? getVal(stage, 'stagename') : formData.get('stageid')) || 'Stage',
                unit: 'un_1',
                unitname: 'Unit Work',
                delaydays: parseInt(formData.get('delaydays')) || 1,
                reasonfordelay: formData.get('reasonfordelay'),
                actionondelay: formData.get('actionondelay'),
                by: formData.get('by'),
                phone: formData.get('phone'),
                status: formData.get('status')
            };

            if (!state.delayLogs) state.delayLogs = [];

            if (existingId) {
                const idx = state.delayLogs.findIndex(d => isEqual(d.id, existingId));
                if (idx !== -1) {
                    state.delayLogs[idx] = item;
                } else {
                    state.delayLogs.unshift(item);
                }

                const psIdx = (state.projectStages || []).findIndex(s => isEqual(getVal(s, 'id'), existingId));
                if (psIdx !== -1) {
                    state.projectStages[psIdx]['reasonfordelay'] = item.reasonfordelay;
                    state.projectStages[psIdx]['actionondelay'] = item.actionondelay;
                    state.projectStages[psIdx]['unitstatus'] = item.status;
                }
            } else {
                state.delayLogs.unshift(item);
            }

            localStorage.setItem('nxg_delayLogs', JSON.stringify(state.delayLogs));
            closeModal();
            render();
            apiRequest({ action: 'saveDelayLog', data: item });
        };

        function Delays() {
            if (!state.delayFilters) {
                state.delayFilters = { project: 'ALL', stage: 'ALL', person: 'ALL', status: 'ALL', dateFrom: '', dateTo: '', activeTab: 'history' };
            }
            const filters = state.delayFilters;

            // Gather all delays from state.delayLogs and state.projectStages
            let rawList = (state.delayLogs || []).filter(d => (parseInt(d.delaydays) || 0) > 0);

            state.projectStages.forEach(ps => {
                const delay = getTaskDelay(ps);
                if (delay > 0) {
                    const reason = getVal(ps, 'reasonfordelay') || getVal(ps, 'reasonForDelay') || getVal(ps, 'remarks') || 'Site Delay';
                    const action = getVal(ps, 'actionondelay') || getVal(ps, 'actionOnDelay') || getVal(ps, 'comments') || '';
                    const pRef = getVal(ps, 'projectrefno');
                    const project = state.projects.find(p => isEqual(getVal(p, 'projectrefno'), pRef));
                    const stage = state.stages.find(s => isEqual(getVal(s, 'stageid'), getVal(ps, 'stageid')));
                    const unit = state.units.find(u => isEqual(getVal(u, 'unitid'), getVal(ps, 'unit')));
                    const owner = getVal(ps, 'stageowner') || getVal(ps, 'employee') || '';
                    const emp = state.employees.find(e => isEqual(getVal(e, 'employeename'), owner) || isEqual(getVal(e, 'employeeid'), owner));

                    const exists = rawList.some(d => isEqual(getVal(d, 'id'), getVal(ps, 'id')));
                    if (!exists) {
                        rawList.push({
                            id: getVal(ps, 'id') || ('ps_' + Math.random().toString(36).substr(2, 6)),
                            date: toInputDate(getVal(ps, 'actualstartdate') || getVal(ps, 'plannedenddate') || new Date().toISOString()),
                            projectrefno: pRef,
                            projectname: (project ? getVal(project, 'projectname') : pRef) || pRef,
                            stageid: getVal(ps, 'stageid'),
                            stagename: (stage ? getVal(stage, 'stagename') : getVal(ps, 'stageid')) || 'Stage',
                            unit: getVal(ps, 'unit'),
                            unitname: (unit ? getVal(unit, 'unitname') : getVal(ps, 'unit')) || 'Unit Work',
                            delaydays: delay,
                            reasonfordelay: reason,
                            actionondelay: action,
                            by: owner || 'Unassigned',
                            phone: emp ? (getVal(emp, 'phone') || '') : '',
                            status: getVal(ps, 'unitstatus') || 'WIP'
                        });
                    }
                }
            });

            // Filter logic
            let filtered = rawList.filter(d => {
                if (filters.project && filters.project !== 'ALL' && !isEqual(d.projectrefno, filters.project)) return false;
                if (filters.stage && filters.stage !== 'ALL' && !isEqual(d.stageid, filters.stage)) return false;
                if (filters.person && filters.person !== 'ALL' && !isEqual((d.by || '').toLowerCase(), filters.person.toLowerCase())) return false;
                if (filters.status && filters.status !== 'ALL') {
                    const st = (d.status || '').toLowerCase();
                    if (filters.status === 'COMPLETED' && st !== 'completed') return false;
                    if (filters.status === 'WIP' && st !== 'wip' && st !== 'in progress') return false;
                    if (filters.status === 'HOLD' && st !== 'hold') return false;
                }
                if (filters.dateFrom && d.date < filters.dateFrom) return false;
                if (filters.dateTo && d.date > filters.dateTo) return false;
                return true;
            });

            filtered.sort((a, b) => new Date(b.date || '2000-01-01') - new Date(a.date || '2000-01-01'));

            const totalDelayIncidents = filtered.length;
            const totalDelayDays = filtered.reduce((acc, curr) => acc + (parseInt(curr.delaydays) || 0), 0);
            const delayedCompletedCount = rawList.filter(d => (d.status || '').toLowerCase() === 'completed').length;
            const criticalDelays = filtered.filter(d => (parseInt(d.delaydays) || 0) >= 4 || (d.status || '').toLowerCase() === 'hold').length;

            // Unique person list
            const personOptionsList = [...new Set([
                ...state.employees.map(e => getVal(e, 'employeename')),
                ...rawList.map(d => d.by).filter(Boolean)
            ])].filter(Boolean);

            // Group tasks for "Today's tasks by whom"
            const peopleTaskGroups = {};

            personOptionsList.forEach(personName => {
                const emp = state.employees.find(e => isEqual(getVal(e, 'employeename'), personName));
                const phone = emp ? (getVal(emp, 'phone') || '') : '';
                
                // Tasks owned by this person
                const tasks = state.projectStages.filter(ps => {
                    const owner = getVal(ps, 'stageowner') || getVal(ps, 'employee');
                    return isEqual(owner, personName);
                });

                // Delays owned by this person
                const delays = rawList.filter(d => isEqual(d.by, personName));

                if (tasks.length > 0 || delays.length > 0) {
                    peopleTaskGroups[personName] = {
                        name: personName,
                        role: emp ? (getVal(emp, 'role') || 'Team Member') : 'Team Member',
                        phone: phone,
                        tasks: tasks,
                        delays: delays
                    };
                }
            });

            return `

                                <i data-lucide="filter" class="w-4 h-4 text-brand-600"></i>
                                <span class="text-xs font-extrabold uppercase tracking-wider text-slate-700">Filter Delay History</span>
                            </div>
                            <button onclick="window.resetDelayFilters()" class="text-xs font-bold text-slate-400 hover:text-brand-600 flex items-center gap-1">
                                <i data-lucide="rotate-ccw" class="w-3 h-3"></i> Clear Filters
                            </button>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-6 gap-3">

                                    <option value="ALL" ${filters.project === 'ALL' ? 'selected' : ''}>All Projects</option>
                                    ${state.projects.map(p => `<option value="${getVal(p, 'projectrefno')}" ${filters.project === getVal(p, 'projectrefno') ? 'selected' : ''}>${getVal(p, 'projectname')}</option>`).join('')}

                                    ${state.stages.map(s => `<option value="${getVal(s, 'stageid')}" ${filters.stage === getVal(s, 'stageid') ? 'selected' : ''}>${getVal(s, 'stagename')}</option>`).join('')}

                            <div>
                                <p class="text-[10px] font-black text-slate-400 uppercase tracking-wider">Delayed but Completed</p>
                                <h3 class="text-xl sm:text-2xl font-black text-emerald-700 mt-0.5">${delayedCompletedCount}</h3>
                            </div>
                        </div>

                        <div class="bg-white p-4 sm:p-5 rounded-2xl border border-slate-200/80 shadow-xs flex items-center gap-4">
                            <div class="w-12 h-12 rounded-2xl bg-orange-50 text-orange-600 flex items-center justify-center font-bold flex-shrink-0">
                                <i data-lucide="alert-circle" class="w-6 h-6"></i>
                            </div>
                            <div>
                                <p class="text-[10px] font-black text-slate-400 uppercase tracking-wider">Critical / On Hold</p>
                                <h3 class="text-xl sm:text-2xl font-black text-slate-900 mt-0.5">${criticalDelays}</h3>
                            </div>
                        </div>
                    </div>

                    <!-- Navigation Sub-Tabs -->
                    <div class="flex items-center gap-2 border-b border-slate-200 pb-1 overflow-x-auto">
                        <button onclick="window.setDelayFilter('activeTab', 'history')" class="px-4 py-2.5 rounded-xl text-xs sm:text-sm font-extrabold transition-all flex items-center gap-2 whitespace-nowrap ${filters.activeTab === 'history' ? 'bg-rose-600 text-white shadow-md shadow-rose-200' : 'text-slate-600 hover:bg-slate-100'}">
                            <i data-lucide="history" class="w-4 h-4"></i>
                            <span>Delay History</span>
                        </button>
                        <button onclick="window.setDelayFilter('activeTab', 'today')" class="px-4 py-2.5 rounded-xl text-xs sm:text-sm font-extrabold transition-all flex items-center gap-2 whitespace-nowrap ${filters.activeTab === 'today' ? 'bg-rose-600 text-white shadow-md shadow-rose-200' : 'text-slate-600 hover:bg-slate-100'}">
                            <i data-lucide="user-check" class="w-4 h-4"></i>
                            <span>Today's Tasks by Whom</span>
                        </button>
                    </div>

                    <!-- TAB 1: DELAY HISTORY TIMELINE -->
                    ${filters.activeTab === 'history' ? `
                        <div class="space-y-4">
                            ${filtered.length === 0 ? `
                                <div class="bg-white p-8 text-center rounded-3xl border border-slate-200 text-slate-400 space-y-2">
                                    <i data-lucide="check-circle" class="w-10 h-10 text-emerald-500 mx-auto"></i>
                                    <p class="text-sm font-bold text-slate-700">No delays found for current filters!</p>
                                    <p class="text-xs text-slate-400">Try adjusting your project, stage, or status filters.</p>
                                </div>
                            ` : filtered.map(item => {
                                const waUrl = getWhatsAppUrl(item.phone, `Hi ${item.by}, regarding delay on ${item.projectname} (${item.reasonfordelay})`);
                                const callUrl = getTelUrl(item.phone);
                                const shortDate = formatShortDate(item.date);
                                const isCompleted = (item.status || '').toLowerCase() === 'completed';

                                return `
                                    <div class="bg-white p-4 sm:p-5 rounded-3xl border border-slate-200/90 shadow-xs hover:border-rose-300 transition-all space-y-3">
                                        <!-- Top Row: Date, Delay Badge, Project info -->
                                        <div class="flex flex-wrap items-center justify-between gap-2 pb-3 border-b border-slate-100">
                                            <div class="flex items-center gap-2">
                                                <!-- Date Badge -->
                                                <div class="px-3 py-1 bg-slate-900 text-white rounded-xl text-xs font-black tracking-wide flex items-center gap-1.5 shadow-xs">
                                                    <i data-lucide="calendar" class="w-3.5 h-3.5 text-rose-400"></i>
                                                    <span>${shortDate}</span>
                                                </div>

                                                <!-- Status Badge -->
                                                ${isCompleted ? `
                                                    <div class="px-3 py-1 bg-emerald-100 text-emerald-800 rounded-xl text-xs font-black flex items-center gap-1">
                                                        <i data-lucide="check-circle" class="w-3.5 h-3.5"></i>
                                                        <span>Delayed but Completed (${item.delaydays} Days)</span>
                                                    </div>
                                                ` : `
                                                    <div class="px-3 py-1 bg-rose-100 text-rose-800 rounded-xl text-xs font-black flex items-center gap-1">
                                                        <i data-lucide="clock" class="w-3.5 h-3.5"></i>
                                                        <span>Delay Added: ${item.delaydays} Days</span>
                                                    </div>
                                                `}
                                            </div>

                                            <div class="flex items-center gap-2">
                                                <span class="text-xs font-bold text-slate-500">${item.projectname}</span>
                                                <span class="text-slate-300">•</span>
                                                <span class="text-xs font-extrabold text-brand-600">${item.stagename}</span>
                                            </div>
                                        </div>

                                        <!-- Content Body: Reason, Action, By -->
                                        <div class="grid grid-cols-1 md:grid-cols-3 gap-3 bg-slate-50/70 p-3.5 rounded-2xl border border-slate-100">
                                            <div>
                                                <p class="text-[10px] font-black uppercase tracking-wider text-rose-500">Reason</p>
                                                <p class="text-xs sm:text-sm font-black text-slate-800 mt-0.5">${item.reasonfordelay || 'Site Delay'}</p>
                                            </div>

                                            <div>
                                                <p class="text-[10px] font-black uppercase tracking-wider text-slate-400">Action</p>
                                                <p class="text-xs sm:text-sm font-bold text-slate-700 mt-0.5">${item.actionondelay || 'Resolution in progress'}</p>
                                            </div>

                                            <div>
                                                <p class="text-[10px] font-black uppercase tracking-wider text-slate-400">By (Person Responsible)</p>
                                                <p class="text-xs sm:text-sm font-black text-slate-900 mt-0.5">${item.by || 'Unassigned'}</p>
                                            </div>
                                        </div>

                                        <!-- Bottom Action Bar -->
                                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pt-1">
                                            <!-- Contact details -->
                                            <div class="flex items-center gap-3">
                                                <div class="w-8 h-8 rounded-full bg-slate-900 text-white font-bold text-xs flex items-center justify-center">
                                                    ${(item.by || 'U').charAt(0).toUpperCase()}
                                                </div>
                                                <div>
                                                    <p class="text-xs font-bold text-slate-900">${item.by || 'Unassigned'}</p>
                                                    <p class="text-[10px] text-slate-400 font-medium">${item.phone || 'No Contact Number'}</p>
                                                </div>
                                            </div>

                                            <!-- Contact & Action Buttons -->
                                            <div class="flex items-center gap-2">
                                                ${item.phone ? `
                                                    <a href="${waUrl}" target="_blank" rel="noopener noreferrer" class="flex-1 sm:flex-initial px-3.5 py-2 bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white rounded-xl text-xs font-bold shadow-xs flex items-center justify-center gap-1.5 transition-all">
                                                        <i data-lucide="message-square" class="w-3.5 h-3.5"></i>
                                                        <span>WhatsApp</span>
                                                    </a>

                                                    <a href="${callUrl}" class="flex-1 sm:flex-initial px-3.5 py-2 bg-blue-600 hover:bg-blue-700 active:scale-95 text-white rounded-xl text-xs font-bold shadow-xs flex items-center justify-center gap-1.5 transition-all">
                                                        <i data-lucide="phone" class="w-3.5 h-3.5"></i>
                                                        <span>Call</span>
                                                    </a>
                                                ` : ''}

                                                <!-- Update Reason & Action Button -->
                                                <button onclick="window.showAddEditDelayModal('${item.id}')" class="flex-1 sm:flex-initial px-3.5 py-2 bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-800 rounded-xl text-xs font-extrabold flex items-center justify-center gap-1.5 transition-all border border-slate-200">
                                                    <i data-lucide="edit-3" class="w-3.5 h-3.5 text-slate-500"></i>
                                                    <span>Update Action</span>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    ` : ''}

                    <!-- TAB 2: TODAY'S TASKS BY WHOM -->
                    ${filters.activeTab === 'today' ? `
                        <div class="space-y-6">
                            <div class="bg-amber-50 border border-amber-200/80 p-4 rounded-2xl flex items-center justify-between gap-3">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-xl bg-amber-500 text-white flex items-center justify-center font-bold">
                                        <i data-lucide="user-check" class="w-5 h-5"></i>
                                    </div>
                                    <div>
                                        <h4 class="text-sm font-extrabold text-amber-900">Today's Assigned Work by Whom</h4>
                                        <p class="text-xs text-amber-700">Filter and manage daily task responsibilities, delay statuses, and direct team contacts.</p>
                                    </div>
                                </div>
                            </div>

                            <div class="space-y-4">
                                ${Object.keys(peopleTaskGroups).length === 0 ? `
                                    <div class="bg-white p-8 text-center rounded-3xl border border-slate-200 text-slate-400">
                                        No task assignments found.
                                    </div>
                                ` : Object.values(peopleTaskGroups).map(group => {
                                    const waUrl = getWhatsAppUrl(group.phone, `Hi ${group.name}, regarding your assigned tasks today.`);
                                    const callUrl = getTelUrl(group.phone);

                                    return `
                                        <div class="bg-white p-5 rounded-3xl border border-slate-200/90 shadow-xs space-y-4">
                                            <!-- Person Header -->
                                            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 border-b border-slate-100">
                                                <div class="flex items-center gap-3">
                                                    <div class="w-10 h-10 rounded-2xl bg-brand-500 text-white font-black text-sm flex items-center justify-center shadow-md shadow-brand-200">
                                                        ${group.name.charAt(0).toUpperCase()}
                                                    </div>
                                                    <div>
                                                        <h3 class="text-base font-black text-slate-900">${group.name}</h3>
                                                        <p class="text-xs text-slate-400 font-medium">${group.role} • ${group.phone}</p>
                                                    </div>
                                                </div>

                                                <!-- Contact Actions -->
                                                <div class="flex items-center gap-2">
                                                    <a href="${waUrl}" target="_blank" rel="noopener noreferrer" class="px-3.5 py-2 bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white rounded-xl text-xs font-bold shadow-xs flex items-center gap-1.5 transition-all">
                                                        <i data-lucide="message-square" class="w-3.5 h-3.5"></i>
                                                        <span>WhatsApp</span>
                                                    </a>
                                                    <a href="${callUrl}" class="px-3.5 py-2 bg-blue-600 hover:bg-blue-700 active:scale-95 text-white rounded-xl text-xs font-bold shadow-xs flex items-center gap-1.5 transition-all">
                                                        <i data-lucide="phone" class="w-3.5 h-3.5"></i>
                                                        <span>Call</span>
                                                    </a>
                                                </div>
                                            </div>

                                            <!-- Assigned Tasks List -->
                                            <div class="space-y-2.5">
                                                <h4 class="text-xs font-black uppercase tracking-wider text-slate-400">Active Stage / Unit Assignments (${group.tasks.length})</h4>
                                                <div class="grid grid-cols-1 md:grid-cols-2 gap-2.5">
                                                    ${group.tasks.map(t => {
                                                        const pRef = getVal(t, 'projectrefno');
                                                        const pObj = state.projects.find(p => isEqual(getVal(p, 'projectrefno'), pRef));
                                                        const delay = getTaskDelay(t);

                                                        return `
                                                            <div class="p-3 bg-slate-50 rounded-2xl border border-slate-200/80 flex items-center justify-between gap-2">
                                                                <div>
                                                                    <p class="text-xs font-black text-slate-900">${pObj ? getVal(pObj, 'projectname') : pRef}</p>
                                                                    <p class="text-[11px] text-slate-500 font-medium">${getVal(t, 'stageid')} - Status: <span class="font-bold text-slate-800">${getVal(t, 'unitstatus') || 'WIP'}</span></p>
                                                                </div>
                                                                ${delay > 0 ? `
                                                                    <span class="px-2.5 py-1 bg-rose-100 text-rose-700 rounded-lg text-[10px] font-black flex-shrink-0">
                                                                        ${delay} Days Delay
                                                                    </span>
                                                                ` : `
                                                                    <span class="px-2.5 py-1 bg-emerald-100 text-emerald-700 rounded-lg text-[10px] font-black flex-shrink-0">
                                                                        On Track
                                                                    </span>
                                                                `}
                                                            </div>
                                                        `;
                                                    }).join('')}
                                                </div>
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function closeModal() {
            document.getElementById('modals').innerHTML = '';
        }

        // --- Main Render Loop ---
        function render() {
            const topbar = document.getElementById('topbar');
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.getElementById('main-content');
            const bottomNav = document.getElementById('bottom-nav');

            if (topbar) topbar.innerHTML = TopHeader();
            if (sidebar) sidebar.innerHTML = Sidebar();
            if (bottomNav) bottomNav.innerHTML = BottomNav();

            const pathOnly = state.currentPath.split('?')[0];

            let content = '';
            switch (pathOnly) {
                case '/': content = Dashboard(); break;
                case '/delays': content = Delays(); break;
                case '/projects': content = Projects(); break;
                case '/planning': content = ProjectPlanning(); break;
                case '/stages': content = Stages(); break;
                case '/team': content = Team(); break;
                case '/daily-entry': content = DailyEntry(); break;
                default: content = `<div class="p-12 text-center text-slate-400"><h2 class="text-2xl font-bold">404 Not Found</h2><button onclick="navigateTo('/')" class="mt-4 text-brand-600 font-bold">Back to Dashboard</button></div>`;
            }

            mainContent.innerHTML = content;
            lucide.createIcons();
        }

        // Initial sync
        refreshData();
    </script>
</body>
</html>
